name: OpsResolve AI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python tests and security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python source
        run: |
          python -m compileall -q app
          python -m py_compile opsresolve_ai_app.py

      - name: Run automated tests
        env:
          IMS_DB_ENABLED: "false"
        run: |
          python -m pytest -v

      - name: Check for committed secrets and runtime databases
        shell: bash
        run: |
          set -e

          tracked_sensitive_files="$(
            git ls-files |
            grep -E '(^|/)(secrets\.toml|\.env)$|\.db$|\.db-wal$|\.db-shm$|\.pem$|\.key$' \
            || true
          )"

          if [ -n "$tracked_sensitive_files" ]; then
            echo "Sensitive or runtime files are tracked by Git:"
            echo "$tracked_sensitive_files"
            exit 1
          fi

          echo "No sensitive or runtime files are tracked by Git."

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build OpsResolve AI image
        run: |
          docker build \
            --tag opsresolve-ai:${{ github.sha }} \
            .